<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Clientes{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <header class="bg-blue-900 text-white shadow">
        <div class="mx-auto max-w-6xl px-6 py-5">
            <h1 class="text-2xl font-bold">Gestión de Clientes</h1>
            <p class="text-sm text-blue-200">Sistema web Flask + MySQL</p>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-8">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="mb-4 rounded-lg p-4
                    {% if categoria == 'success' %}
                        bg-green-100 text-green-800
                    {% else %}
                        bg-red-100 text-red-800
                    {% endif %}">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="py-6 text-center text-sm text-slate-500">
        Aplicación modular desarrollada con Flask y MySQL
    </footer>
</body>
</html>
