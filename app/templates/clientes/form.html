
<!-- CAMPO: NOMBRE -->
<div class="form-group">
    <label for="nombre">Nombre completo *</label>

    <input
        type="text"
        id="nombre"
        name="nombre"
        value="{{ form_data.nombre }}"
        required
        minlength="2"
        maxlength="100"
        pattern=".*\S.*"
        title="Ingresa un nombre de entre 2 y 100 caracteres."
        autocomplete="name"
    >
</div>

<!-- CAMPO: CORREO ELECTRÓNICO -->
<div class="form-group">
    <label for="correo">Correo electrónico *</label>

    <input
        type="email"
        id="correo"
        name="correo"
        value="{{ form_data.correo }}"
        required
        maxlength="120"
        autocomplete="email"
        title="Ingresa un correo válido, por ejemplo usuario@dominio.com."
    >
</div>

<!-- CAMPO: TELÉFONO OPCIONAL -->
<div class="form-group">
    <label for="telefono">Teléfono (opcional)</label>

    <input
        type="tel"
        id="telefono"
        name="telefono"
        value="{{ form_data.telefono }}"
        maxlength="20"
        pattern="[0-9+() -]{7,20}"
        inputmode="tel"
        autocomplete="tel"
        title="Ingresa entre 7 y 15 dígitos. Puedes usar +, paréntesis, espacios o guiones."
    >
</div>
